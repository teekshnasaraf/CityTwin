<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CITYTWIN — In-Memory NetworkX Graph Store & Groq LLM Graph RAG</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- Leaflet GIS Map CSS & JS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>

  <!-- React & Babel -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    :root {
      --bg-dark: #090d16;
      --bg-card: rgba(18, 25, 41, 0.88);
      --bg-card-hover: rgba(28, 38, 61, 0.95);
      --border-glow: rgba(59, 130, 246, 0.25);
      --text-main: #f1f5f9;
      --text-muted: #94a3b8;
      --accent-cyan: #06b6d4;
      --accent-blue: #3b82f6;
      --accent-purple: #8b5cf6;
      --accent-rose: #f43f5e;
      --accent-emerald: #10b981;
      --accent-amber: #f59e0b;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Inter', sans-serif; background-color: var(--bg-dark); color: var(--text-main); line-height: 1.5; }
    h1, h2, h3, h4, .brand-title { font-family: 'Outfit', sans-serif; }
    
    .glass-panel { background: var(--bg-card); backdrop-filter: blur(14px); border: 1px solid var(--border-glow); border-radius: 14px; box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.45); }
    
    /* Navigation Bar & Header */
    .app-header { display: flex; justify-content: space-between; align-items: center; padding: 14px 28px; background: rgba(11, 15, 25, 0.95); border-bottom: 1px solid rgba(255, 255, 255, 0.08); position: sticky; top: 0; z-index: 1000; gap: 16px; }
    .logo-badge { width: 40px; height: 40px; border-radius: 10px; background: linear-gradient(135deg, var(--accent-cyan), var(--accent-blue)); display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 18px; color: #fff; box-shadow: 0 0 15px rgba(6, 182, 212, 0.4); }
    
    .nav-tabs { display: flex; gap: 6px; background: rgba(15, 23, 42, 0.6); padding: 4px; border-radius: 10px; border: 1px solid rgba(255, 255, 255, 0.08); }
    .nav-tab { padding: 8px 14px; border-radius: 8px; font-size: 12px; font-weight: 600; color: var(--text-muted); cursor: pointer; transition: all 0.2s ease; border: none; background: transparent; white-space: nowrap; }
    .nav-tab.active { background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple)); color: white; box-shadow: 0 2px 10px rgba(59, 130, 246, 0.4); }
    
    .search-box-container { display: flex; align-items: center; gap: 8px; background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(6, 182, 212, 0.3); border-radius: 8px; padding: 4px 8px; }
    .search-input { background: transparent; border: none; color: #fff; font-size: 13px; outline: none; width: 220px; }
    .search-btn { background: linear-gradient(135deg, var(--accent-cyan), var(--accent-blue)); color: #fff; border: none; padding: 6px 12px; border-radius: 6px; font-size: 12px; font-weight: 700; cursor: pointer; white-space: nowrap; }
    .search-btn:hover { opacity: 0.9; }

    .dashboard-grid { display: grid; grid-template-columns: 1fr 380px; gap: 20px; padding: 20px 28px; }
    
    /* Real GIS Leaflet Map Styling */
    .map-container { position: relative; min-height: 560px; border-radius: 14px; overflow: hidden; border: 1px solid var(--border-glow); }
    #leaflet-map { width: 100%; height: 560px; background: #0b0f19; z-index: 1; }
    
    .map-layer-controls { position: absolute; top: 16px; left: 16px; display: flex; gap: 8px; z-index: 1000; }
    .layer-btn { background: rgba(15, 23, 42, 0.9); border: 1px solid rgba(255, 255, 255, 0.18); color: var(--text-muted); padding: 7px 14px; border-radius: 8px; font-size: 12px; font-weight: 600; cursor: pointer; backdrop-filter: blur(8px); }
    .layer-btn.active { background: var(--accent-blue); color: white; border-color: var(--accent-cyan); box-shadow: 0 0 12px rgba(59, 130, 246, 0.5); }
    
    .builder-panel { padding: 22px; display: flex; flex-direction: column; gap: 18px; }
    .form-group { display: flex; flex-direction: column; gap: 6px; }
    .form-label { font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; color: var(--text-muted); }
    .form-input, .form-range { width: 100%; background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.12); border-radius: 8px; padding: 10px; color: var(--text-main); font-size: 14px; }
    
    .btn-primary { background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple)); color: white; border: none; padding: 12px 18px; border-radius: 8px; font-weight: 600; cursor: pointer; transition: transform 0.15s ease; box-shadow: 0 4px 14px rgba(59, 130, 246, 0.35); }
    .btn-primary:hover { transform: translateY(-2px); }
    .btn-secondary { background: rgba(255, 255, 255, 0.08); color: var(--text-main); border: 1px solid rgba(255, 255, 255, 0.15); padding: 10px 14px; border-radius: 8px; font-weight: 500; cursor: pointer; }
    .btn-action { background: rgba(6, 182, 212, 0.15); border: 1px solid rgba(6, 182, 212, 0.4); color: var(--accent-cyan); padding: 8px 14px; border-radius: 8px; font-size: 12px; font-weight: 600; cursor: pointer; }
    .btn-action:hover { background: rgba(6, 182, 212, 0.3); }

    .results-section { padding: 0 28px 28px 28px; display: flex; flex-direction: column; gap: 16px; }
    .kpi-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; }
    .kpi-card { padding: 18px; display: flex; flex-direction: column; gap: 8px; }
    .kpi-header { display: flex; justify-content: space-between; align-items: center; font-size: 12px; color: var(--text-muted); font-weight: 600; }
    .kpi-main-val { font-size: 26px; font-weight: 800; font-family: 'Outfit', sans-serif; }
    .badge-negative { background: rgba(244, 63, 94, 0.2); color: var(--accent-rose); border: 1px solid rgba(244, 63, 94, 0.4); padding: 2px 8px; border-radius: 12px; font-size: 12px; font-weight: 700; }
    
    .recommendation-banner { padding: 22px; border-left: 4px solid var(--accent-emerald); display: flex; flex-direction: column; gap: 12px; margin: 0 28px 28px 28px; }
    .freshness-bar { display: flex; gap: 24px; padding: 12px 28px; background: rgba(0, 0, 0, 0.5); font-size: 12px; color: var(--text-muted); border-top: 1px solid rgba(255, 255, 255, 0.05); }
    .pulse-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent-emerald); display: inline-block; margin-right: 6px; box-shadow: 0 0 8px var(--accent-emerald); }

    /* Custom Leaflet Dark Popup */
    .leaflet-popup-content-wrapper { background: rgba(15, 23, 42, 0.95); color: #f1f5f9; border: 1px solid rgba(59, 130, 246, 0.4); border-radius: 8px; font-family: 'Inter', sans-serif; }
    .leaflet-popup-tip { background: rgba(15, 23, 42, 0.95); }

    /* AI & Ingestion Studio Cards */
    .studio-container { padding: 24px 28px; display: flex; flex-direction: column; gap: 24px; }
    .table-dark { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 13px; }
    .table-dark th { background: rgba(255, 255, 255, 0.04); text-align: left; padding: 12px; color: var(--text-muted); font-weight: 600; border-bottom: 1px solid rgba(255, 255, 255, 0.1); }
    .table-dark td { padding: 12px; border-bottom: 1px solid rgba(255, 255, 255, 0.05); color: var(--text-main); }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const INITIAL_CITIES = {
      "3": { name: "Lucknow, Uttar Pradesh", center: [26.8467, 80.9462], zoom: 13 },
      "1": { name: "Chennai, Tamil Nadu", center: [13.0600, 80.2500], zoom: 13 },
      "2": { name: "Bengaluru, Karnataka", center: [12.9716, 77.5946], zoom: 13 },
      "4": { name: "Gandhinagar, Gujarat", center: [23.2156, 72.6369], zoom: 13 },
      "5": { name: "Mumbai, Maharashtra", center: [19.0760, 72.8777], zoom: 12 },
      "6": { name: "Delhi NCR, India", center: [28.6139, 77.2090], zoom: 12 }
    };

    function Dashboard() {
      const [citiesCatalog, setCitiesCatalog] = useState(INITIAL_CITIES);
      const [activeTab, setActiveTab] = useState('simulation');
      const [cityId, setCityId] = useState('3'); // Default Lucknow
      const [searchQuery, setSearchQuery] = useState('');
      const [searchLoading, setSearchLoading] = useState(false);
      const [searchStatusMsg, setSearchStatusMsg] = useState('');

      const [cityRoads, setCityRoads] = useState([]);
      const [graphMeta, setGraphMeta] = useState(null);

      const [roadId, setRoadId] = useState(301);
      const [duration, setDuration] = useState(4);
      const [trafficFactor, setTrafficFactor] = useState(1.1);
      const [weatherFactor, setWeatherFactor] = useState(1.2);
      const [scenarioType, setScenarioType] = useState('road_closure');
      
      const [isSimulated, setIsSimulated] = useState(false);
      const [simulationData, setSimulationData] = useState(null);
      const [recommendationData, setRecommendationData] = useState(null);
      const [loading, setLoading] = useState(false);

      // Groq LLM Graph RAG State
      const [graphRagResult, setGraphRagResult] = useState(null);

      const mapInstanceRef = useRef(null);
      const layersRef = useRef({ polylines: [], markers: [] });
      const activeCityObj = citiesCatalog[cityId] || citiesCatalog["3"];

      // Fetch In-Memory NetworkX Spatial Graph from Backend REST API
      const fetchInMemoryCityGraph = async (targetCityId) => {
        const numId = Number(targetCityId.slice(-4)) || 3;
        setSearchStatusMsg(`⚡ Fetching NetworkX Spatial Graph for city_id=${numId}...`);
        try {
          const res = await fetch(`/api/v1/simulations/city-graph?city_id=${numId}`);
          const graphData = await res.json();

          setGraphMeta({ nodes: graphData.total_nodes, edges: graphData.total_edges });
          setCityRoads(graphData.edges);

          if (graphData.edges && graphData.edges.length > 0) {
            setRoadId(graphData.edges[0].road_id);
          }
          setSearchStatusMsg(`⚡ In-Memory Graph Active: ${graphData.total_edges} Edges & ${graphData.total_nodes} Intersections loaded in <1ms!`);
        } catch (err) {
          console.error("Failed to load in-memory city graph:", err);
        }
      };

      useEffect(() => {
        fetchInMemoryCityGraph(cityId);
      }, [cityId]);

      // Initialize Leaflet Map using Esri Dark Gray Canvas
      useEffect(() => {
        if (activeTab !== 'simulation') return;

        setTimeout(() => {
          if (!mapInstanceRef.current && document.getElementById('leaflet-map')) {
            const map = L.map('leaflet-map', {
              center: activeCityObj.center,
              zoom: activeCityObj.zoom,
              zoomControl: false,
            });

            L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Base/MapServer/tile/{z}/{y}/{x}', {
              maxZoom: 19,
              attribution: 'Tiles &copy; Esri &mdash; Esri, DeLorme, NAVTEQ',
            }).addTo(map);

            L.control.zoom({ position: 'bottomright' }).addTo(map);
            mapInstanceRef.current = map;
          }

          if (mapInstanceRef.current) {
            const map = mapInstanceRef.current;
            map.flyTo(activeCityObj.center, activeCityObj.zoom, { duration: 1.5 });

            layersRef.current.polylines.forEach(p => map.removeLayer(p));
            layersRef.current.markers.forEach(m => map.removeLayer(m));
            layersRef.current.polylines = [];
            layersRef.current.markers = [];

            cityRoads.forEach((road, idx) => {
              const isClosed = isSimulated && road.road_id === Number(roadId);
              const isRerouted = isSimulated && !isClosed && (idx % 3 === 0);

              let color = '#06b6d4'; // Glowing Cyan
              if (idx % 3 === 1) color = '#3b82f6'; // Electric Blue
              if (idx % 3 === 2) color = '#8b5cf6'; // Purple

              let weight = 5;
              let opacity = 0.85;
              let dashArray = null;

              if (isClosed) {
                color = '#f43f5e'; // Bright Red
                weight = 9;
                opacity = 1.0;
                dashArray = '8, 8';
              } else if (isRerouted) {
                color = '#f59e0b'; // Amber Gold
                weight = 7;
                opacity = 0.95;
              }

              const polyline = L.polyline(road.path, { color, weight, opacity, dashArray, lineCap: 'round', lineJoin: 'round' }).addTo(map);
              polyline.bindPopup(`<strong>${road.name}</strong><br/>Capacity: ${road.capacity} veh/h<br/>Status: ${isClosed ? '<span style="color:#f43f5e;font-weight:bold;">CLOSED</span>' : (isRerouted ? '<span style="color:#f59e0b;font-weight:bold;">REROUTED FLOW</span>' : '<span style="color:#10b981;">OPEN FLOW</span>')}`);
              polyline.on('click', () => setRoadId(road.road_id));
              layersRef.current.polylines.push(polyline);
            });
          }
        }, 100);
      }, [activeTab, cityId, roadId, isSimulated, activeCityObj, cityRoads]);

      // Universal City Search Handler with Backend Dynamic Graph Registration
      const handleUniversalCitySearch = async (e) => {
        e.preventDefault();
        if (!searchQuery.trim()) return;

        setSearchLoading(true);
        setSearchStatusMsg(`🔍 Geocoding and building In-Memory NetworkX graph for "${searchQuery}"...`);

        try {
          const nomRes = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(searchQuery)}`);
          const nomData = await nomRes.json();

          if (!nomData || nomData.length === 0) {
            setSearchStatusMsg(`❌ City "${searchQuery}" not found on OpenStreetMap.`);
            setSearchLoading(false);
            return;
          }

          const topMatch = nomData[0];
          const lat = parseFloat(topMatch.lat);
          const lon = parseFloat(topMatch.lon);
          const cityName = topMatch.display_name.split(',')[0];
          const fullTitle = `${cityName}, ${topMatch.display_name.split(',').slice(-1)[0].trim()}`;
          const newCityIdStr = String(Date.now());
          const newCityIdNum = Number(newCityIdStr.slice(-4));

          // Register in-memory NetworkX Graph in backend
          const regRes = await fetch('/api/v1/simulations/register-city-graph', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              city_id: newCityIdNum,
              name: fullTitle,
              lat: lat,
              lon: lon
            })
          });
          const graphData = await regRes.json();

          const newCityObj = { name: fullTitle, center: [lat, lon], zoom: 13 };
          setCitiesCatalog(prev => ({ ...prev, [newCityIdStr]: newCityObj }));
          setCityId(newCityIdStr);

          setCityRoads(graphData.edges);
          setGraphMeta({ nodes: graphData.total_nodes, edges: graphData.total_edges });
          if (graphData.edges && graphData.edges[0]) setRoadId(graphData.edges[0].road_id);

          setIsSimulated(false);
          setSimulationData(null);
          setRecommendationData(null);
          setSearchStatusMsg(`✅ Created In-Memory NetworkX Spatial Graph for "${fullTitle}"!`);
          setSearchQuery('');
        } catch (err) {
          console.error(err);
          setSearchStatusMsg(`❌ Failed to search city: ${err.message}`);
        } finally {
          setSearchLoading(false);
        }
      };

      const handleCityChange = (newCityId) => {
        setCityId(newCityId);
        setIsSimulated(false);
        setSimulationData(null);
        setRecommendationData(null);
      };

      const runSimulation = async () => {
        setLoading(true);
        try {
          const targetId = Number(cityId.slice(-4)) || 3;
          const res = await fetch('/api/v1/simulations/run', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              city_id: targetId,
              closed_road_id: roadId,
              duration_hours: duration,
              capacity_factor: scenarioType === 'capacity_reduction' ? 0.5 : 0.0,
              traffic_factor: trafficFactor,
              weather_factor: weatherFactor,
            }),
          });
          const data = await res.json();
          setSimulationData(data);
          setIsSimulated(true);
        } catch (err) {
          console.error(err);
        } finally {
          setLoading(false);
        }
      };

      const runGraphRagGroqLlm = async () => {
        setLoading(true);
        try {
          const targetId = Number(cityId.slice(-4)) || 3;
          const res = await fetch('/api/v1/simulations/graph-rag-llm', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              city_id: targetId,
              closed_road_id: roadId,
              duration_hours: duration
            })
          });
          const data = await res.json();
          setGraphRagResult(data);
        } catch (err) {
          console.error(err);
        } finally {
          setLoading(false);
        }
      };

      const evaluateRecommendations = async () => {
        setLoading(true);
        try {
          const targetId = Number(cityId.slice(-4)) || 3;
          const res = await fetch(`/api/v1/simulations/recommendation/evaluate?city_id=${targetId}&closed_road_id=${roadId}&duration_hours=${duration}`);
          const data = await res.json();
          setRecommendationData(data);
          if (data.recommendations && data.recommendations[0]) {
            setSimulationData(data.recommendations[0].simulation);
            setIsSimulated(true);
          }
        } catch (err) {
          console.error(err);
        } finally {
          setLoading(false);
        }
      };

      return (
        <div style={{ minHeight: '100vh', display: 'flex', flexDirection: 'column' }}>
          {/* Header & Tabs Navigation */}
          <header className="app-header">
            <div style={{ display: 'flex', alignItems: 'center', gap: '12px' }}>
              <div className="logo-badge">CT</div>
              <div>
                <h1 style={{ fontSize: '18px', fontWeight: '800', background: 'linear-gradient(135deg, #06b6d4, #3b82f6)', WebkitBackgroundClip: 'text', WebkitTextFillColor: 'transparent' }}>
                  CITYTWIN
                </h1>
                <p style={{ fontSize: '10px', color: '#94a3b8' }}>IN-MEMORY NETWORKX GRAPH & GROQ LLM</p>
              </div>
            </div>

            <div className="nav-tabs">
              <button className={`nav-tab ${activeTab === 'simulation' ? 'active' : ''}`} onClick={() => setActiveTab('simulation')}>
                📍 NetworkX Spatial Simulation
              </button>
              <button className={`nav-tab ${activeTab === 'ai' ? 'active' : ''}`} onClick={() => setActiveTab('ai')}>
                ⚡ Groq LLM Graph RAG Studio
              </button>
              <button className={`nav-tab ${activeTab === 'optimization' ? 'active' : ''}`} onClick={() => setActiveTab('optimization')}>
                🏆 Intervention Optimizer
              </button>
            </div>

            {/* UNIVERSAL CITY SEARCH BAR */}
            <form onSubmit={handleUniversalCitySearch} className="search-box-container">
              <input
                type="text"
                className="search-input"
                placeholder="Search ANY city in the world..."
                value={searchQuery}
                onChange={e => setSearchQuery(e.target.value)}
              />
              <button type="submit" className="search-btn" disabled={searchLoading}>
                {searchLoading ? '⌛ Searching...' : '🔍 Search City'}
              </button>
            </form>

            <select className="form-input" style={{ width: '220px', fontWeight: '700', color: '#06b6d4' }} value={cityId} onChange={e => handleCityChange(e.target.value)}>
              {Object.entries(citiesCatalog).map(([id, c]) => (
                <option key={id} value={id}>📍 {c.name}</option>
              ))}
            </select>
          </header>

          {searchStatusMsg && (
            <div style={{ padding: '8px 28px', background: 'rgba(6, 182, 212, 0.15)', borderBottom: '1px solid rgba(6, 182, 212, 0.3)', color: '#06b6d4', fontSize: '13px', fontWeight: '600' }}>
              {searchStatusMsg}
            </div>
          )}

          {/* TAB 1: DIGITAL TWIN SIMULATION & GIS MAP */}
          {activeTab === 'simulation' && (
            <div>
              <div className="dashboard-grid">
                <div className="map-container glass-panel">
                  <div className="map-layer-controls">
                    <button className="layer-btn active">⚡ In-Memory NetworkX Graph Store</button>
                    <button className="layer-btn active">🛣️ {graphMeta ? `${graphMeta.edges} Edges` : 'Loading...'} | 📍 {graphMeta ? `${graphMeta.nodes} Intersections` : ''}</button>
                  </div>
                  <div style={{ position: 'absolute', top: 16, right: 16, background: 'rgba(15, 23, 42, 0.9)', padding: '8px 14px', borderRadius: '8px', border: '1px solid rgba(59, 130, 246, 0.4)', fontSize: '12px', fontWeight: '700', color: '#06b6d4', zIndex: 1000 }}>
                    📍 Graph GIS Plot: {activeCityObj.name}
                  </div>
                  <div id="leaflet-map"></div>
                  {isSimulated && (
                    <div style={{ position: 'absolute', bottom: 20, left: '50%', transform: 'translateX(-50%)', background: 'rgba(244, 63, 94, 0.95)', padding: '8px 20px', borderRadius: '20px', color: '#fff', fontSize: '12px', fontWeight: '700', zIndex: 1000 }}>
                      ⚠️ ROAD CLOSURE SIMULATED — CASCADING REROUTING ON NETWORKX GRAPH
                    </div>
                  )}
                </div>

                <div className="builder-panel glass-panel">
                  <h3 style={{ fontSize: '18px', fontWeight: '700' }}>SCENARIO BUILDER</h3>
                  <div className="form-group">
                    <label className="form-label">Intervention Type</label>
                    <select className="form-input" value={scenarioType} onChange={e => setScenarioType(e.target.value)}>
                      <option value="road_closure">Road Closure (Virtual Modification)</option>
                      <option value="capacity_reduction">Lane Capacity Reduction (50%)</option>
                    </select>
                  </div>

                  <div className="form-group">
                    <label className="form-label">Target NetworkX Road ({cityRoads.length} Edges)</label>
                    <select className="form-input" value={roadId} onChange={e => setRoadId(Number(e.target.value))}>
                      {cityRoads.map(r => (
                        <option key={r.road_id} value={r.road_id}>{r.name}</option>
                      ))}
                    </select>
                  </div>

                  <div className="form-group">
                    <div style={{ display: 'flex', justifyContent: 'space-between' }}>
                      <label className="form-label">Closure Duration</label>
                      <span style={{ fontSize: '13px', fontWeight: '700', color: '#06b6d4' }}>{duration} Hours</span>
                    </div>
                    <input type="range" min="1" max="24" className="form-range" value={duration} onChange={e => setDuration(Number(e.target.value))} />
                  </div>

                  <button className="btn-primary" onClick={runSimulation} disabled={loading}>
                    {loading ? 'SIMULATING...' : '▶ SIMULATE CASCADING IMPACT'}
                  </button>
                  <button className="btn-secondary" onClick={runGraphRagGroqLlm} disabled={loading}>
                    ⚡ RUN GROQ LLM GRAPH RAG
                  </button>
                </div>
              </div>

              <div className="results-section">
                <div style={{ fontSize: '16px', fontWeight: '700', color: '#f1f5f9' }}>NETWORKX CASCADING SIMULATION IMPACT ({activeCityObj.name.split(',')[0].toUpperCase()})</div>
                <div className="kpi-grid">
                  <div className="kpi-card glass-panel">
                    <div className="kpi-header">TRAFFIC CONGESTION</div>
                    <div style={{ display: 'flex', alignItems: 'baseline', gap: '10px' }}>
                      <span className="kpi-main-val">{(simulationData?.traffic?.scenario_congestion * 100 || 31).toFixed(0)}%</span>
                      <span className="badge-negative">+{simulationData?.traffic?.change_percent || 106}%</span>
                    </div>
                    <div style={{ fontSize: '11px', color: '#94a3b8' }}>Baseline: {(simulationData?.traffic?.baseline_congestion * 100 || 15).toFixed(0)}%</div>
                  </div>

                  <div className="kpi-card glass-panel">
                    <div className="kpi-header">BUS ROUTE DELAY</div>
                    <div style={{ display: 'flex', alignItems: 'baseline', gap: '10px' }}>
                      <span className="kpi-main-val">{simulationData?.transit?.scenario_transit_time_min || 25} min</span>
                      <span className="badge-negative">+{simulationData?.transit?.delay_minutes || 13} min</span>
                    </div>
                    <div style={{ fontSize: '11px', color: '#94a3b8' }}>Baseline: {simulationData?.transit?.baseline_transit_time_min || 12} min</div>
                  </div>

                  <div className="kpi-card glass-panel">
                    <div className="kpi-header">EMERGENCY RESPONSE ETA</div>
                    <div style={{ display: 'flex', alignItems: 'baseline', gap: '10px' }}>
                      <span className="kpi-main-val">{simulationData?.emergency?.scenario_eta_min || 17} min</span>
                      <span className="badge-negative">+{simulationData?.emergency?.eta_increase_min || 9} min</span>
                    </div>
                    <div style={{ fontSize: '11px', color: '#94a3b8' }}>Baseline: {simulationData?.emergency?.baseline_eta_min || 8} min</div>
                  </div>

                  <div className="kpi-card glass-panel">
                    <div className="kpi-header">POLLUTION EXPOSURE</div>
                    <div style={{ display: 'flex', alignItems: 'baseline', gap: '10px' }}>
                      <span className="kpi-main-val">{simulationData?.pollution?.scenario_pollution_index || 52}</span>
                      <span className="badge-negative">+{simulationData?.pollution?.change_percent || 16}%</span>
                    </div>
                    <div style={{ fontSize: '11px', color: '#94a3b8' }}>Baseline: {simulationData?.pollution?.baseline_pollution_index || 45}</div>
                  </div>
                </div>
              </div>
            </div>
          )}

          {/* TAB 2: GROQ LLM GRAPH RAG STUDIO */}
          {activeTab === 'ai' && (
            <div className="studio-container">
              <div className="glass-panel" style={{ padding: '22px' }}>
                <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '14px' }}>
                  <h3 style={{ fontSize: '18px', fontWeight: '700', color: '#06b6d4' }}>⚡ Groq LLM Graph RAG Intelligence Engine</h3>
                  <button className="btn-primary" onClick={runGraphRagGroqLlm} disabled={loading}>
                    {loading ? 'EXTRACTING SUBGRAPH & INFERRING...' : '⚡ RUN GRAPH RAG + GROQ LLM'}
                  </button>
                </div>

                {graphRagResult ? (
                  <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '20px' }}>
                    <div style={{ padding: '16px', background: 'rgba(255, 255, 255, 0.03)', borderRadius: '10px', border: '1px solid rgba(255, 255, 255, 0.1)' }}>
                      <div style={{ fontSize: '13px', color: '#06b6d4', fontWeight: '700' }}>2-HOP EXTRACTED SUBGRAPH RAG CONTEXT</div>
                      <div style={{ fontSize: '12px', color: '#cbd5e1', marginTop: '6px' }}>
                        Target Closed Road: <strong>{graphRagResult.graph_rag_subgraph.target_road.name}</strong><br/>
                        Sub-Network Corridors Extracted: <strong>{graphRagResult.graph_rag_subgraph.connected_corridors_count} Roads</strong>
                      </div>

                      <div style={{ marginTop: '12px', maxHeight: '200px', overflowY: 'auto' }}>
                        <table className="table-dark">
                          <thead>
                            <tr><th>CONNECTED CORRIDOR</th><th>CAPACITY</th><th>STATUS</th></tr>
                          </thead>
                          <tbody>
                            {graphRagResult.graph_rag_subgraph.connected_corridors.map((c, i) => (
                              <tr key={i}>
                                <td>{c.name}</td>
                                <td>{c.capacity_veh_hr} veh/h</td>
                                <td>{c.is_target_closed ? <span style={{ color: '#f43f5e', fontWeight: 'bold' }}>CLOSED</span> : <span style={{ color: '#10b981' }}>OPEN</span>}</td>
                              </tr>
                            ))}
                          </tbody>
                        </table>
                      </div>
                    </div>

                    <div style={{ padding: '16px', background: 'rgba(6, 182, 212, 0.1)', borderRadius: '10px', border: '1px solid #06b6d4' }}>
                      <div style={{ fontSize: '13px', color: '#10b981', fontWeight: '700' }}>GROQ LLM GRAPH REASONING OUTPUT</div>
                      <div style={{ fontSize: '32px', fontWeight: '800', color: '#06b6d4', marginTop: '8px' }}>
                        {graphRagResult.groq_llm_prediction.predicted_vehicle_spillover} Vehicles
                      </div>
                      <div style={{ fontSize: '12px', color: '#cbd5e1', marginTop: '4px' }}>
                        Model: <strong>{graphRagResult.groq_llm_prediction.model_used}</strong><br/>
                        Provenance: <strong style={{ color: '#10b981' }}>{graphRagResult.groq_llm_prediction.provenance}</strong>
                      </div>
                    </div>
                  </div>
                ) : (
                  <div style={{ padding: '30px', color: '#94a3b8', fontSize: '13px' }}>Click 'Run Graph RAG + Groq LLM' to extract the 2-hop connected graph topology from the In-Memory Store and pass it to Groq LLM.</div>
                )}
              </div>
            </div>
          )}

          {/* TAB 3: INTERVENTION OPTIMIZER */}
          {activeTab === 'optimization' && (
            <div className="studio-container">
              <div className="glass-panel" style={{ padding: '22px' }}>
                <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '16px' }}>
                  <h3 style={{ fontSize: '18px', fontWeight: '700', color: '#10b981' }}>🏆 Multi-Criteria Intervention Option Evaluator</h3>
                  <button className="btn-primary" onClick={evaluateRecommendations} disabled={loading}>
                    {loading ? 'EVALUATING...' : '⚡ EVALUATE OPTIONS NOW'}
                  </button>
                </div>

                {recommendationData ? (
                  <div style={{ display: 'flex', flexDirection: 'column', gap: '16px' }}>
                    <div style={{ padding: '16px', background: 'rgba(16, 185, 129, 0.12)', border: '1px solid #10b981', borderRadius: '10px' }}>
                      <div style={{ fontSize: '13px', color: '#10b981', fontWeight: '700' }}>RECOMMENDED OPTION FOR URBAN OPERATORS</div>
                      <div style={{ fontSize: '20px', fontWeight: '800', color: '#fff', marginTop: '4px' }}>{recommendationData.recommendations[0].intervention}</div>
                      <p style={{ fontSize: '13px', color: '#cbd5e1', marginTop: '6px' }}>{recommendationData.reason || recommendationData.recommendations[0].reason}</p>
                    </div>

                    <div style={{ display: 'grid', gridTemplateColumns: 'repeat(3, 1fr)', gap: '16px' }}>
                      {recommendationData.recommendations.map(r => (
                        <div key={r.rank} style={{ padding: '16px', background: r.rank === 1 ? 'rgba(16, 185, 129, 0.1)' : 'rgba(255, 255, 255, 0.03)', borderRadius: '10px', border: r.rank === 1 ? '1px solid #10b981' : '1px solid rgba(255, 255, 255, 0.1)' }}>
                          <div style={{ fontSize: '12px', color: r.rank === 1 ? '#10b981' : '#94a3b8', fontWeight: '700' }}>RANK #{r.rank} (Score: {r.score})</div>
                          <div style={{ fontSize: '16px', fontWeight: '700', color: '#fff', marginTop: '4px' }}>{r.intervention}</div>
                          <div style={{ fontSize: '12px', color: '#94a3b8', marginTop: '8px' }}>
                            Congestion: +{r.simulation.traffic.change_percent}%<br/>
                            Bus Delay: +{r.simulation.transit.delay_minutes} min<br/>
                            Hospital ETA: +{r.simulation.emergency.eta_increase_min} min<br/>
                            Pollution: +{r.simulation.pollution.change_percent}%
                          </div>
                        </div>
                      ))}
                    </div>
                  </div>
                ) : (
                  <div style={{ padding: '30px', color: '#94a3b8', fontSize: '13px' }}>Click 'Evaluate Options Now' to run multi-criteria optimization across Option A (Full Closure), Option B (Lane Reduction), and Option C (Off-Peak Closure).</div>
                )}
              </div>
            </div>
          )}

          {/* Freshness Bar */}
          <footer className="freshness-bar" style={{ marginTop: 'auto' }}>
            <div><span className="pulse-dot"></span> In-Memory Graph Store: <strong>NetworkX Active</strong></div>
            <div><span className="pulse-dot" style={{ background: '#06b6d4' }}></span> Groq LLM Engine: <strong>Llama-3.3-70B Active</strong></div>
            <div style={{ marginLeft: 'auto' }}>PostgreSQL 18 + PostGIS 3.6 (Persistence Layer)</div>
          </footer>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<Dashboard />);
  </script>
</body>
</html>
